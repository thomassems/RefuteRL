[project]
name = "refuterl"
version = "0.1.0"
description = "An RL environment and benchmark for finding counterexamples to math claims."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refuterl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
